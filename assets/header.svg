<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetGlow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bold { font-weight: 800; }
    .medium { font-weight: 600; }
    .regular { font-weight: 400; }
  </style>

  <!-- Card Background -->
  <rect x="10" y="10" width="900" height="260" rx="16" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Ambient Glow Orbs -->
  <rect x="10" y="10" width="900" height="260" rx="16" fill="url(#cyanGlow)" />
  <rect x="10" y="10" width="900" height="260" rx="16" fill="url(#violetGlow)" />

  <!-- Window Header / Terminal Bar -->
  <circle cx="36" cy="38" r="6" fill="#ef4444" />
  <circle cx="56" cy="38" r="6" fill="#eab308" />
  <circle cx="76" cy="38" r="6" fill="#22c55e" />
  <text x="100" y="42" fill="#64748b" font-size="12" class="mono">rakesh@dtu:~/profile (main)</text>

  <line x1="12" y1="58" x2="908" y2="58" stroke="#1e293b" stroke-width="1" />

  <!-- Tagline / Greeting -->
  <text x="40" y="94" fill="#38bdf8" font-size="13" class="sans bold" letter-spacing="1.5">⚡ HELLO WORLD, I AM</text>

  <!-- Main Name Title -->
  <text x="38" y="138" fill="url(#nameGradient)" font-size="38" class="sans bold" letter-spacing="-0.5">RAKESH CHAUDHARY</text>

  <!-- Subtitle -->
  <text x="40" y="172" fill="#cbd5e1" font-size="15" class="sans medium">
    Agentic AI Engineer <tspan fill="#64748b">•</tspan> Systems &amp; Kernel Researcher <tspan fill="#64748b">•</tspan> Competitive Programmer
  </text>

  <!-- Badges Row -->
  <!-- Badge 1: DTU -->
  <rect x="40" y="198" width="205" height="34" rx="17" fill="#0c4a6e" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
  <text x="142" y="220" text-anchor="middle" fill="#38bdf8" font-size="12" class="sans medium">🎓 B.Tech M&amp;C @ DTU</text>

  <!-- Badge 2: BEL -->
  <rect x="255" y="198" width="235" height="34" rx="17" fill="#312e81" fill-opacity="0.3" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
  <text x="372" y="220" text-anchor="middle" fill="#a5b4fc" font-size="12" class="sans medium">💼 Agentic AI Intern @ BEL</text>

  <!-- Badge 3: Codeforces -->
  <rect x="500" y="198" width="195" height="34" rx="17" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
  <text x="597" y="220" text-anchor="middle" fill="#34d399" font-size="12" class="sans medium">🏆 CF Expert (Peak 1620+)</text>

  <!-- Badge 4: Specialization -->
  <rect x="705" y="198" width="175" height="34" rx="17" fill="#831843" fill-opacity="0.25" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1" />
  <text x="792" y="220" text-anchor="middle" fill="#f472b6" font-size="12" class="sans medium">🤖 Multi-Agent &amp; Systems</text>
</svg>
